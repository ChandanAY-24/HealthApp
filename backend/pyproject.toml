[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "halsa-backend"
version = "1.0.0"
description = "Halsa Personal Health Record REST API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "sqlalchemy>=2.0.35",
    "aiosqlite>=0.20.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]

